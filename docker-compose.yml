services:
  nginx:
    build:
      context: ./nginx
      dockerfile: ./docker/Dockerfile
    image: ft_nginx_prd
    container_name: ft_nginx
    ports:
      - 8443:443
    networks:
      - ft_network
    env_file:
      - ./nginx/.env.local
    depends_on:
      - frontend
      - be_common
      - be_connect
  frontend:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    image: ft_frontend
    container_name: ft_frontend
    environment:
      NODE_ENV: production
    env_file:
      - ./frontend/.env.local
    networks:
      - ft_network
    command: ${FE_CMD:-npm run start}
  be_common:
    build:
      context: ./backends/common
      dockerfile: ./docker/Dockerfile
    image: ft_be_common_prd
    container_name: ft_be_common
    environment:
      NODE_ENV: production
    env_file:
      - ./backends/common/.env.development
    networks:
      - ft_network
    command: ${BE_COM_CMD:-npm run start}
  be_connect:
    build:
      context: ./backends/connect
      dockerfile: ./docker/Dockerfile
    image: ft_be_connect_prd
    container_name: ft_be_connect
    environment:
      NODE_ENV: production
    env_file:
      - ./backends/connect/.env.development
    networks:
      - ft_network
    command: ${BE_CN_CMD:-npm run start}
networks:
  ft_network:
    driver: bridge
